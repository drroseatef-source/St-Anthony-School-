<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1b2a5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="logo.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>مدرسة القديس اثناسيوس الرسولي للعلوم الكنسية</title>
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#1b2a5c;--gold:#e8b93c;--maroon:#7a1f2b;--cream:#f7f0e1;--bg:#fbf7ee;--c:#fff;--t:#23233a;--m:#777;--b:#e4dac4;--ca:rgba(255,255,255,.9)}
@media (prefers-color-scheme:dark){:root{--bg:#14172a;--c:#1f2340;--t:#f1ead8;--m:#b3aa94;--b:#383d63;--cream:#1f2340;--ca:rgba(31,35,64,.88)}}
*{box-sizing:border-box}
body::before,body::after{content:"";position:fixed;left:0;right:0;pointer-events:none;z-index:-1;background-repeat:no-repeat}
body::before{top:0;height:55vh;background-image:url(bg-candles.webp);background-size:cover;background-position:center;opacity:.10;-webkit-mask-image:linear-gradient(#000 35%,transparent);mask-image:linear-gradient(#000 35%,transparent)}
body::after{bottom:0;height:100vh;background-image:url(bg-saint.webp);background-size:contain;background-position:center bottom;opacity:.09;-webkit-mask-image:radial-gradient(ellipse 60% 50% at 50% 42%,#000 35%,transparent 100%);mask-image:radial-gradient(ellipse 60% 50% at 50% 42%,#000 35%,transparent 100%)}
@media (prefers-color-scheme:dark){body::before{opacity:.17}body::after{opacity:.14}}
@media print{body::before,body::after{display:none}}

body{margin:0;font-family:Cairo,system-ui,Tahoma,sans-serif;background:var(--bg);color:var(--t)}
header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:4px solid var(--gold)}
header img{width:72px;height:72px;object-fit:contain}
header b{display:block;font-size:1.05em;font-weight:900}header span{font-size:.75em;color:var(--gold)}
main{max-width:640px;margin:auto;padding:12px}
.card{background:var(--ca);border:1px solid var(--b);border-radius:14px;padding:14px;margin:10px 0}
input,select,button{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--b);background:var(--c);color:var(--t);width:100%;margin:4px 0}
button{background:var(--maroon);color:#fff;border:0;cursor:pointer;font-weight:700}
button.s{background:transparent;color:var(--maroon);border:1px solid var(--maroon)}
button.g{background:var(--gold);color:var(--navy)}
@media (prefers-color-scheme:dark){button.s{color:var(--gold);border-color:var(--gold)}}
nav{display:flex;gap:6px}nav button{width:auto;flex:1}
nav button.on{background:var(--navy)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.m{color:var(--m);font-size:.85em}
.idc{text-align:center;border:3px solid var(--maroon);border-radius:16px;background:var(--cream);padding:14px;position:relative}
.idc img{width:56px}.idc h3{margin:6px 0 0;color:var(--navy)}.idc .n{color:var(--maroon);font-weight:900}
@media (prefers-color-scheme:dark){.idc h3{color:var(--gold)}.idc .n{color:var(--gold)}}
.bar{height:8px;background:var(--b);border-radius:6px;overflow:hidden;margin:4px 0}.bar i{display:block;height:100%;background:var(--navy)}.bar.w i{background:#c0392b}.w{color:#c0392b}.ok{color:#2e7d32}
@media (prefers-color-scheme:dark){.bar i{background:var(--gold)}}

.pa{display:flex;justify-content:center;margin:10px 0}
.pa.sheet{display:grid;grid-template-columns:repeat(auto-fill,85.6mm);gap:4mm;justify-content:center}
.id,.slip{width:85.6mm;height:54mm;border-radius:3mm;overflow:hidden;background:#fbf7ee;color:#23233a;border:.4mm solid #e8b93c;display:flex;flex-direction:column;box-shadow:0 1px 6px #0003;break-inside:avoid;font-family:Cairo,Tahoma,sans-serif;direction:rtl}
.ih{background:#1b2a5c;color:#fff;height:11mm;display:flex;align-items:center;gap:2mm;padding:0 2.5mm;border-bottom:.9mm solid #e8b93c;flex:none}
.ih img{height:9.6mm;width:auto}.ih b{display:block;font-size:2.55mm;line-height:1.2;font-weight:900}.ih span{font-size:2mm;color:#e8b93c}
.ib{flex:1;display:flex;align-items:center;gap:2.5mm;padding:1.5mm 3mm}
.ph{width:22mm;height:29mm;flex:none;border:.5mm solid #7a1f2b;border-radius:1.5mm;overflow:hidden;background:#e4dac4;display:flex;align-items:center;justify-content:center;font-size:9mm}
.ph img{width:100%;height:100%;object-fit:cover}
.in{flex:1;min-width:0;text-align:center}.in h4{margin:0;font-size:3.7mm;line-height:1.3;color:#1b2a5c;font-weight:900}
.in p{margin:.8mm 0 0;font-size:2.6mm;color:#7a1f2b;font-weight:700}.in .cd{font-size:2.8mm;letter-spacing:.3mm;direction:ltr;color:#23233a}
.qr{width:23mm;height:23mm;flex:none;background:#fff;padding:.8mm;border:.3mm solid #e4dac4}.qr img{width:100%;height:100%;display:block}.qr canvas{display:none}
.if{background:#7a1f2b;color:#fff;font-size:2.1mm;text-align:center;height:4mm;line-height:4mm;flex:none}
.slip .sb{flex:1;padding:2.5mm 4mm;display:flex;flex-direction:column;justify-content:center;gap:1.6mm;font-size:3mm}
.slip .sb div{display:flex;justify-content:space-between;align-items:center;border-bottom:.2mm dashed #c9bd9f;padding-bottom:1mm}
.slip .sb code{direction:ltr;font-family:Consolas,monospace;font-size:3.6mm;font-weight:700;color:#7a1f2b}
.slip .sb small{font-size:2.2mm;color:#555;text-align:center;display:block}
@media print{
 body{background:#fff}
 body.printing header,body.printing nav,body.printing .noprint{display:none!important}
 body.printing main>*{display:none!important}
 body.printing main>.pr{display:flex!important}
 body.printing main>.pr.sheet{display:grid!important}
 body.printing main{padding:0;margin:0;max-width:none}
 body.printing .pa{margin:0;justify-content:flex-start}
 body.printing .id,body.printing .slip{box-shadow:none}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

textarea{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--b);background:var(--c);color:var(--t);width:100%;margin:4px 0}
nav{flex-wrap:wrap}nav button{min-width:76px}
a{color:var(--maroon);font-weight:700;text-decoration:none}
@media (prefers-color-scheme:dark){a{color:var(--gold)}}
.new{background:#c0392b;color:#fff;border-radius:8px;padding:0 8px;font-size:.75em;white-space:nowrap}
.opt{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--b);cursor:pointer}.opt input{width:auto;margin:0;flex:none}
pre.ex{background:var(--bg);border:1px dashed var(--b);border-radius:10px;padding:8px;margin:4px 0;font:inherit;font-size:.85em;white-space:pre-wrap;direction:rtl}
.rvt{width:100%;border-collapse:collapse}.rvt th,.rvt td{border:1px solid var(--b);padding:5px 8px;text-align:right;font-size:.85em}
@media print{.rvt th,.rvt td{color:#000;border-color:#888}}
</style>
</head>
<body>
<header><img src="logo.png" alt=""><div><b>مدرسة القديس اثناسيوس الرسولي للعلوم الكنسية</b><span>كنيسة رئيس الملائكة الجليل ميخائيل ببهتيم</span></div></header>
<main id="app"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,updatePassword} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,getDoc,getDocs,setDoc,updateDoc,addDoc,collection,query,where,writeBatch,serverTimestamp,deleteDoc} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyDpsJ0BZ9J9HuOF7PuEELwIN-5T7crqpsk",
  authDomain:"st-anthony-school-584ae.firebaseapp.com",
  projectId:"st-anthony-school-584ae",
  storageBucket:"st-anthony-school-584ae.firebasestorage.app",
  messagingSenderId:"386346441700",
  appId:"1:386346441700:web:fa6ea87e3f65ef8a2a45f1"
};
const fb=initializeApp(firebaseConfig),auth=getAuth(fb),db=getFirestore(fb);
let auth2=null;                       // second auth instance: creates student accounts without logging the admin out
const secondAuth=()=>auth2??(auth2=getAuth(initializeApp(firebaseConfig,"creator")));

const $=s=>document.querySelector(s),app=$("#app");
let role=null,me=null,tab="students",Y=2026,signingUp=false;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mail=u=>u.includes("@")?u.trim():u.trim().toLowerCase()+"@church.app";
const col=n=>collection(db,n);
const list=async q=>(await getDocs(q)).docs.map(d=>({id:d.id,...d.data()}));
const fmt=n=>Math.round(n*10)/10;
const SUBJ=[["عهد قديم",1],["طقس",1],["عهد جديد",2],["تاريخ كنيسة",2],["عقيدة",3],["لاهوت مقارن",3],["لاهوت دفاعي",4],["قبطي",4]];

/* ---------- أدوات مساعدة (بدون اتصال بالسيرفر) ---------- */
const ar2en=v=>String(v??"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));
const normPhone=v=>{let d=ar2en(v).replace(/[^\d]/g,"");if(d.length==10&&d[0]=="1")d="0"+d;return d};
const toISO=v=>{
  if(typeof v==="number"&&v>1000&&v<100000)return new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5).toISOString().slice(0,10);
  const m=ar2en(v).match(/(\d{1,2})\s*[\/\-\.]\s*(\d{1,2})\s*[\/\-\.]\s*(\d{4})/);
  if(!m)return "";
  const d=+m[1],mo=+m[2];if(mo<1||mo>12||d<1||d>31)return "";
  return `${m[3]}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
};
const stageDur=t=>{t=String(t??"");return /ثالث/.test(t)?1:/ثاني/.test(t)?2:/[أا]ول/.test(t)?3:null};
const clean=v=>String(v??"").replace(/\s+/g," ").trim();
const wordsOf=n=>clean(n).split(" ").filter(Boolean).length;
function missingOf(s){
  const m=[];
  if(wordsOf(s.full_name)<3)m.push("الاسم غير كامل");
  if(!(s.phones&&s.phones.length))m.push("التليفون");
  else if(s.phones.some(p=>p.length!=11))m.push("رقم التليفون غير مكتمل");
  if(!s.address)m.push("العنوان");
  if(!s.birth_date)m.push("تاريخ الميلاد");
  if(!s.confession_father)m.push("أب الاعتراف");
  if(!s.church)m.push("الكنيسة");
  return m;
}
function rowToStudent(r){
  const g=k=>{const key=Object.keys(r).find(x=>clean(x).replace(/\s*\(.*\)/,"")==k);return key?r[key]:""};
  const ph=normPhone(g("التليفون"));
  return {full_name:clean(g("الاسم رباعي")),phones:ph?[ph]:[],birth_date:toISO(g("تاريخ الميلاد")),address:clean(g("العنوان")),confession_father:clean(g("أب الاعتراف")),church:clean(g("الكنيسة")),stage:clean(g("المرحلة"))};
}
function parseQuiz(text){
  const qs=[],errs=[];
  String(text).replace(/\r/g,"").split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean).forEach((b,i)=>{
    const lines=b.split("\n").map(x=>x.trim()).filter(Boolean);
    const q=lines.shift().replace(/^\d+\s*[\.\-\)]\s*/,"");
    const options=[];let ans=-1,stars=0;
    lines.forEach(l=>{
      if(!/^[-•]/.test(l))return;
      let t=l.replace(/^[-•]\s*/,"").trim();
      if(/[*✓✔]$/.test(t)){t=t.replace(/\s*[*✓✔]+$/,"").trim();ans=options.length;stars++}
      if(t)options.push(t);
    });
    if(options.length<2)errs.push(`سؤال ${i+1}: لازم اختيارين على الأقل`);
    else if(stars!=1)errs.push(`سؤال ${i+1}: لازم تحددي إجابة واحدة صح بعلامة *`);
    else qs.push({q,options,answer:ans});
  });
  return {qs,errs};
}
const quizToText=qs=>qs.map(q=>q.q+"\n"+q.options.map((o,i)=>"- "+o+(i==q.answer?" *":"")).join("\n")).join("\n\n");
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});

/* ---------- الدخول ---------- */
onAuthStateChanged(auth,u=>{ if(signingUp)return; u?route(u):login() });

async function route(u){
  try{
    const s=await getDoc(doc(db,"users",u.uid));
    if(!s.exists()){await signOut(auth);return login("الحساب ده مش مفعّل، كلمي الأدمن")}
    me=s.data();role=me.role;
    const st=await getDoc(doc(db,"settings","main"));if(st.exists())Y=st.data().year;
    if(role==="admin"){await ensureSeed();admin()}else student();
  }catch(e){login("حصل خطأ: "+(e.message||e))}
}
async function ensureSeed(){
  const subs=await getDocs(col("subjects"));
  if(!subs.empty)return;
  const b=writeBatch(db);
  SUBJ.forEach(([name,term],i)=>b.set(doc(db,"subjects","s"+(i+1)),{name,term,sort:i+1}));
  b.set(doc(db,"settings","main"),{year:Y});
  await b.commit();
}
async function login(msg=""){
  let first=true;
  try{first=!(await getDoc(doc(db,"settings","adminlock"))).exists()}catch(e){}
  app.innerHTML=`<div class="card"><div style="text-align:center"><img src="logo.png" alt="" style="width:120px;height:120px"></div><b>تسجيل الدخول</b><input id="u" placeholder="اسم المستخدم" autocomplete="username"><input id="p" type="password" placeholder="كلمة المرور" autocomplete="current-password">
  <button id="go">دخول</button>${first?'<button class="s" id="su">إنشاء حساب الأدمن (أول مرة فقط)</button>':""}<div class="m" id="lm">${esc(msg)}</div></div>`;
  $("#go").onclick=async()=>{
    try{await signInWithEmailAndPassword(auth,mail($("#u").value),$("#p").value)}
    catch(e){$("#lm").textContent="بيانات الدخول غير صحيحة"}
  };
  if($("#su"))$("#su").onclick=async()=>{
    const u=$("#u").value,p=$("#p").value;
    if(!u||p.length<8)return $("#lm").textContent="اكتبي اسم مستخدم وكلمة مرور 8 أحرف على الأقل";
    signingUp=true;
    try{
      const c=await createUserWithEmailAndPassword(auth,mail(u),p);
      const b=writeBatch(db);
      b.set(doc(db,"users",c.user.uid),{role:"admin",name:u});
      b.set(doc(db,"settings","adminlock"),{by:c.user.uid,at:serverTimestamp()});
      await b.commit();
      signingUp=false;route(c.user);
    }catch(e){
      signingUp=false;try{await signOut(auth)}catch(_){}
      $("#lm").textContent=e.code==="auth/email-already-in-use"?"اسم المستخدم ده موجود":(e.message||String(e));
    }
  };
}
function shell(body){
  app.innerHTML=`<nav><button class="${tab=="students"?"on":"s"}" data-t="students">المخدومين</button><button class="${tab=="batches"?"on":"s"}" data-t="batches">الدفعات</button><button class="${tab=="att"?"on":"s"}" data-t="att">الحضور</button><button class="${tab=="content"?"on":"s"}" data-t="content">المحتوى</button><button class="${tab=="rep"?"on":"s"}" data-t="rep">التقارير</button><button class="s" id="pw" style="flex:.8">كلمة المرور</button><button class="s" id="out" style="flex:.6">خروج</button></nav>${body}`;
  document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tab=b.dataset.t;admin()});
  $("#out").onclick=()=>signOut(auth);
  $("#pw").onclick=changePw;
}
function changePw(){
  app.innerHTML=`<div class="card"><b>تغيير كلمة المرور</b><input id="np" type="password" placeholder="كلمة المرور الجديدة (8 أحرف على الأقل)" autocomplete="new-password"><input id="np2" type="password" placeholder="أعيدي كتابتها" autocomplete="new-password"><button id="sp" class="g">حفظ</button><button class="s" id="cx">رجوع</button><div class="m" id="pm"></div></div>`;
  $("#cx").onclick=()=>route(auth.currentUser);
  $("#sp").onclick=async()=>{
    const a=$("#np").value;
    if(a.length<8)return $("#pm").textContent="لازم 8 أحرف على الأقل";
    if(a!==$("#np2").value)return $("#pm").textContent="الكلمتين مش متطابقتين";
    try{
      await updatePassword(auth.currentUser,a);
      if(role==="student"){try{await updateDoc(doc(db,"students",me.studentId),{init_pw:""})}catch(e){}}
      $("#pm").textContent="تم تغيير كلمة المرور ✔";
    }catch(e){
      $("#pm").textContent=e.code==="auth/requires-recent-login"?"سجلي خروج ثم دخول من جديد وحاولي تاني":(e.message||String(e));
    }
  };
}
const admin=()=>tab=="batches"?batches():tab=="att"?attendance():tab=="content"?content():tab=="rep"?reports():students();

/* ---------- حساب الحضور ---------- */
function calc(subs,lecs,atts){
  const rows=[];
  [...subs].sort((a,b)=>a.term-b.term||a.sort-b.sort).forEach(s=>{
    const total=lecs.filter(l=>l.subject_id==s.id).length;if(!total)return;
    const got=atts.filter(a=>a.subject_id==s.id).length;
    const pct=Math.min(100,fmt(got/total*100));
    rows.push({subject_name:s.name,attended:got,total_lectures:total,attendance_pct:pct,attendance_grade:fmt(pct*25/100),warning:pct<70});
  });
  return rows;
}
function attBlock(groups){
  return groups.map(g=>`<div class="card"><b>${esc(g.name)}</b> <span class="m">${esc(g.batch)}</span>${g.items.map(r=>`<div class="${r.warning?"w":""}"><div class="row"><span>${esc(r.subject_name)}</span><span>${r.attended}/${r.total_lectures} • ${r.attendance_pct}% • ${r.attendance_grade}/25${r.warning?" ⚠":""}</span></div><div class="bar ${r.warning?"w":""}"><i style="width:${r.attendance_pct}%"></i></div></div>`).join("")||'<div class="m">لا توجد محاضرات بعد</div>'}</div>`).join("")||'<div class="card m">لا توجد بيانات حضور بعد</div>';
}

/* ---------- الحضور ---------- */
async function attendance(){
  const subs=(await list(col("subjects"))).sort((a,b)=>a.term-b.term||a.sort-b.sort);
  shell(`<div class="card"><b>فتح محاضرة</b><select id="sj">${subs.map(x=>`<option value="${x.id}">الترم ${x.term} - ${esc(x.name)}</option>`).join("")}</select>
  <select id="wk">${[1,2,3,4,5,6,7,8].map(i=>`<option value="${i}">الأسبوع ${i}</option>`).join("")}</select><button id="op" class="g">فتح وبدء المسح</button></div>`);
  $("#op").onclick=async()=>{
    const sj=$("#sj").value,wk=+$("#wk").value,s=subs.find(x=>x.id==sj);
    const lec={id:`${Y}_${sj}_${wk}`,year:Y,subject_id:sj,week_no:wk,subject_name:s.name,term:s.term};
    try{await setDoc(doc(db,"lectures",lec.id),lec)}catch(e){return alert(e.message)}
    scanner(lec,`الترم ${s.term} - ${s.name} - الأسبوع ${wk}`);
  };
}
async function scanner(lec,title){
  const ex=await list(query(col("attendance"),where("lecture_id","==",lec.id)));
  const names=ex.map(a=>a.student_name);
  app.innerHTML=`<div class="card"><b>${esc(title)}</b><div id="rd" style="width:100%;margin:8px 0"></div><div id="msg" class="m">وجّهي الكاميرا على الـ QR</div>
  <input id="mc" placeholder="أو اكتبي الكود يدويًا"><button id="mb" class="g">تسجيل</button></div>
  <div class="card"><b>الحاضرين: <span id="cnt">0</span></b><div id="ls" class="m"></div></div><button class="s" id="st">إنهاء المحاضرة</button>`;
  const draw=()=>{$("#cnt").textContent=names.length;$("#ls").innerHTML=names.slice().reverse().map(esc).join("<br>")};draw();
  let last="",lt=0;
  const mark=async raw=>{
    const code=raw.trim().toUpperCase();
    if(!code||(code===last&&Date.now()-lt<4000))return;last=code;lt=Date.now();
    if(!/^[A-Z0-9]{4,20}$/.test(code)){$("#msg").innerHTML='<span class="w">كود غير معروف</span>';return}
    try{
      const sd=await getDoc(doc(db,"students",code));
      if(!sd.exists()){$("#msg").innerHTML='<span class="w">كود غير معروف</span>';return}
      const s=sd.data(),aid=`${lec.id}_${code}`;

async function shrink(file){
  const im=await createImageBitmap(file),W=270,H=360,c=document.createElement("canvas");c.width=W;c.height=H;
  const k=Math.max(W/im.width,H/im.height),w=im.width*k,h=im.height*k;
  c.getContext("2d").drawImage(im,(W-w)/2,(H-h)/2,w,h);
  return c.toDataURL("image/jpeg",.78);
}
function renderQR(){document.querySelectorAll(".qr").forEach(el=>{if(el.dataset.d)return;el.dataset.d=1;new QRCode(el,{text:el.dataset.c,width:200,height:200,correctLevel:QRCode.CorrectLevel.M})})}
function printEl(id,size){

async function createStudent(f,batch){
  let code;do{code=genCode()}while((await getDoc(doc(db,"students",code))).exists());
  const a2=secondAuth(),pw=genPw();let uid=null,user;
  for(let i=0;i<5&&!uid;i++){
    user=genUser();
    try{uid=(await createUserWithEmailAndPassword(a2,mail(user),pw)).user.uid}
    catch(e){if(e.code!=="auth/email-already-in-use")throw e}
  }
  if(!uid)throw new Error("تعذر إنشاء اسم مستخدم، حاولي مرة أخرى");
  await signOut(a2);
  const s={full_name:f.full_name,birth_date:f.birth_date||"",address:f.address||"",confession_father:f.confession_father||"",church:f.church||"",phones:f.phones||[],batch_id:batch.id,batch_name:batch.name,code,user_id:uid,username:user,init_pw:pw,photo:f.photo||"",created:serverTimestamp()};
  const b=writeBatch(db);
  b.set(doc(db,"students",code),s);
  b.set(doc(db,"users",uid),{role:"student",studentId:code,name:s.full_name});
  await b.commit();
  return {...s,id:code};
}

  <div class="m">الصقي الأسئلة بالشكل ده: سطر السؤال، وتحته الاختيارات كل واحد بشرطة، والإجابة الصح بعلامة * في آخرها، وسطر فاضي بين كل سؤالين.</div>
  <pre class="ex">ما هو أول أسفار العهد القديم؟
- التكوين *
- الخروج
- اللاويين</pre>
  <textarea id="qx" rows="10" placeholder="الأسئلة هنا">${esc(e?quizToText(e.questions):"")}</textarea>
  <button id="qpv" class="s">معاينة</button><div id="qpr"></div><button id="qsv" class="g">${e?"حفظ التعديل":"حفظ كمسودة"}</button>${e?'<button id="qcx" class="s">إلغاء التعديل</button>':""}</div>
  ${qz.sort((a,b)=>b.at-a.at).map(q=>`<div class="card"><div class="row"><b>${esc(q.title)}</b><span class="m">${STATUS[q.status]||""}</span></div><div class="m">${esc(q.subject_name)} • الأسبوع ${q.week_no} • ${q.questions.length} سؤال</div>
  <div class="row" style="gap:6px;margin-top:6px">${q.status=="draft"?`<button class="g" data-qa="pub:${esc(q.id)}">نشر</button><button class="s" data-qa="edit:${esc(q.id)}">تعديل</button>`:q.status=="open"?`<button class="s" data-qa="close:${esc(q.id)}">إغلاق</button>`:`<button class="s" data-qa="pub:${esc(q.id)}">فتح تاني</button>`}${q.status!="draft"?`<button class="s" data-qa="res:${esc(q.id)}">النتائج</button>`:""}<button class="s" data-qa="del:${esc(q.id)}">حذف</button></div></div>`).join("")}`);

  $("#addm").onclick=async()=>{
    const url=$("#mu").value.trim(),title=clean($("#mt").value);
    if(!title)return alert("اكتبي عنوان");
    if(!/^https:\/\//.test(url))return alert("اللينك لازم يبدأ بـ https://");
    const s=subs.find(x=>x.id==$("#msj").value);
    await addDoc(col("materials"),{year:Y,subject_id:s.id,subject_name:s.name,week_no:+$("#mwk").value,title,url,kind:$("#mk").value,at:Date.now()});
    content();
  };
  document.querySelectorAll("[data-dm]").forEach(b=>b.onclick=async()=>{if(confirm("حذف المادة دي؟")){await deleteDoc(doc(db,"materials",b.dataset.dm));content()}});

  const preview=()=>{
    const r=parseQuiz($("#qx").value);
    $("#qpr").innerHTML=`<div class="m">${r.qs.length} سؤال سليم</div>${r.errs.map(x=>`<div class="w">${esc(x)}</div>`).join("")}${r.qs.map((q,i)=>`<div class="card"><b>${i+1}. ${esc(q.q)}</b>${q.options.map((o,j)=>`<div class="${j==q.answer?"ok":""}">${j==q.answer?"✔":"•"} ${esc(o)}</div>`).join("")}</div>`).join("")}`;
    return r;
  };
  $("#qpv").onclick=preview;
  $("#qsv").onclick=async()=>{
    const r=preview(),title=clean($("#qt").value);
    if(!title)return alert("اكتبي عنوان الكويز");
    if(r.errs.length||!r.qs.length)return alert("صلحي الأخطاء الأول");
    const s=subs.find(x=>x.id==$("#qsj").value);
    const data={year:Y,subject_id:s.id,subject_name:s.name,week_no:+$("#qwk").value,title,questions:r.qs};
    if(e)await updateDoc(doc(db,"quizzes",e.id),data);
    else await addDoc(col("quizzes"),{...data,status:"draft",at:Date.now()});
    editQ=null;content();
  };
  if($("#qcx"))$("#qcx").onclick=()=>{editQ=null;content()};
  document.querySelectorAll("[data-qa]").forEach(b=>b.onclick=async()=>{
    const [a,id]=b.dataset.qa.split(":"),q=qz.find(x=>x.id==id);
    if(a=="pub"){await updateDoc(doc(db,"quizzes",id),{status:"open"});content()}
    else if(a=="close"){await updateDoc(doc(db,"quizzes",id),{status:"closed"});content()}
    else if(a=="edit"){editQ=id;content()}
    else if(a=="del"){if(confirm("حذف الكويز ده؟ النتائج المسجلة هتفضل في قاعدة البيانات.")){await deleteDoc(doc(db,"quizzes",id));content()}}
    else if(a=="res")quizResults(q);
  });
}
async function quizResults(q){
  const [rs,sts,bts]=await Promise.all([list(query(col("quiz_results"),where("quiz_id","==",q.id))),list(col("students")),list(col("batches"))]);
  const act=new Set(bts.filter(b=>b.entry_year<=Y&&Y<b.entry_year+b.duration_years).map(b=>b.id));
  const rows=sts.filter(s=>act.has(s.batch_id)).sort(arSort).map(s=>({s,r:rs.find(x=>x.student_id==s.id)}));
  const done=rows.filter(x=>x.r),avg=done.length?fmt(done.reduce((a,x)=>a+x.r.score/x.r.total*100,0)/done.length):0;
  app.innerHTML=`<div class="card"><b>${esc(q.title)}</b><div class="m">${esc(q.subject_name)} • الأسبوع ${q.week_no}</div><div class="m">حلّ ${done.length} من ${rows.length} • المتوسط ${avg}%</div></div>
  ${rows.map(({s,r})=>`<div class="card row"><div>${esc(s.full_name)}<div class="m">${esc(s.batch_name)}</div></div><div>${r?`<b>${r.score}/${r.total}</b> <span class="m">${fmt(r.score/r.total*100)}%</span> <button class="s" style="width:auto;padding:4px 8px" data-rm="${esc(r.id)}">إعادة</button>`:'<span class="m">لم يحل</span>'}</div></div>`).join("")}
  <button class="s" id="bk">رجوع</button>`;
  $("#bk").onclick=()=>{tab="content";admin()};
  document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=async()=>{if(confirm("مسح نتيجة المخدوم عشان يحل الكويز تاني؟")){await deleteDoc(doc(db,"quiz_results",b.dataset.rm));quizResults(q)}});
}

/* ---------- شاشة المخدوم ---------- */
let sTab="home";
const seen=(k,set)=>{try{const key=`seen_${k}_${me.studentId}`;if(set){localStorage.setItem(key,String(set));return 0}return +localStorage.getItem(key)||0}catch(e){return 0}};
function sShell(body){
  app.innerHTML=`<nav><button class="${sTab=="home"?"on":"s"}" data-s="home">الرئيسية</button><button class="${sTab=="mat"?"on":"s"}" data-s="mat">المادة العلمية</button><button class="${sTab=="quiz"?"on":"s"}" data-s="quiz">الكويزات</button></nav>${body}`;
  document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{sTab=b.dataset.s;student()});
}
const student=()=>sTab=="mat"?stuMaterials():sTab=="quiz"?stuQuizzes():stuHome();

async function stuHome(){
  const code=me.studentId;
  const sd=await getDoc(doc(db,"students",code));
  const s=sd.exists()?sd.data():null;
  let rows=[];
  if(s){
    const [subs,lecs,atts]=await Promise.all([list(col("subjects")),list(query(col("lectures"),where("year","==",Y))),list(query(col("attendance"),where("student_id","==",code),where("year","==",Y)))]);
    rows=calc(subs,lecs,atts);
  }
  sShell(`<div class="pa">${s?cardHtml(s):"حسابك لسه مش مربوط ببيانات مخدوم، كلمي الأدمن."}</div>${s?`<div class="card"><b>حضوري</b>${rows.map(r=>`<div class="${r.warning?"w":""}"><div class="row"><span>${esc(r.subject_name)}</span><span>${r.attended}/${r.total_lectures} • ${r.attendance_pct}%${r.warning?" ⚠":""}</span></div><div class="bar ${r.warning?"w":""}"><i style="width:${r.attendance_pct}%"></i></div></div>`).join("")||'<div class="m">لسه مفيش محاضرات متسجلة</div>'}</div>`:""}<button class="s" id="pw">تغيير كلمة المرور</button><button class="s" id="out">خروج</button>`);
  $("#pw").onclick=changePw;
  renderQR();
  $("#out").onclick=()=>signOut(auth);
}
async function stuMaterials(){
  const [subs,ms]=await Promise.all([list(col("subjects")),list(query(col("materials"),where("year","==",Y)))]);
  const ls=seen("mat");
  subs.sort((a,b)=>a.term-b.term||a.sort-b.sort);
  const g=subs.map(s=>({s,items:ms.filter(m=>m.subject_id==s.id&&/^https:\/\//.test(m.url)).sort((a,b)=>a.week_no-b.week_no||a.at-b.at)})).filter(x=>x.items.length);
  sShell(g.map(x=>`<div class="card"><b>${esc(x.s.name)}</b>${x.items.map(m=>`<div class="row" style="margin-top:8px"><a href="${esc(m.url)}" target="_blank" rel="noopener">${KIND[m.kind]||"📎"} الأسبوع ${m.week_no} - ${esc(m.title)}</a>${m.at>ls?'<span class="new">جديد</span>':""}</div>`).join("")}</div>`).join("")||'<div class="card m">لسه مفيش مواد علمية</div>');
  seen("mat",Date.now());
}
async function stuQuizzes(){
  const code=me.studentId;
  const [o,c,rs]=await Promise.all([list(query(col("quizzes"),where("year","==",Y),where("status","==","open"))),list(query(col("quizzes"),where("year","==",Y),where("status","==","closed"))),list(query(col("quiz_results"),where("student_id","==",code),where("year","==",Y)))]);
  const qs=[...o,...c].sort((a,b)=>b.at-a.at),ls=seen("quiz");
  sShell(qs.map(q=>{
    const r=rs.find(x=>x.quiz_id==q.id);
    return `<div class="card"><div class="row"><b>${esc(q.title)}</b>${q.at>ls&&!r?'<span class="new">جديد</span>':""}</div><div class="m">${esc(q.subject_name)} • الأسبوع ${q.week_no} • ${q.questions.length} سؤال</div>
    <div class="row" style="margin-top:6px">${r?`<b class="ok">درجتك ${r.score}/${r.total}</b>`:q.status=="open"?'<span class="m">لم تحل بعد</span>':'<span class="m w">انتهى وقت الكويز</span>'}<button class="${!r&&q.status=="open"?"g":"s"}" style="width:auto" data-q="${esc(q.id)}">${r?"التفاصيل":q.status=="open"?"ابدأ الكويز":"عرض"}</button></div></div>`;
  }).join("")||'<div class="card m">مفيش كويزات متاحة دلوقتي</div>');
  seen("quiz",Date.now());
  document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>takeQuiz(qs.find(x=>x.id==b.dataset.q),rs.find(x=>x.quiz_id==b.dataset.q)));
}
function takeQuiz(q,res){
  const back=`<button class="s" id="bk">رجوع</button>`;
  const answers=()=>q.questions.map((qq,i)=>`<div class="card"><b>${i+1}. ${esc(qq.q)}</b><div class="ok">✔ ${esc(qq.options[qq.answer])}</div></div>`).join("");
  if(res||q.status!="open"){
    sShell(`<div class="card"><b>${esc(q.title)}</b>${res?`<div class="ok" style="margin-top:6px">درجتك ${res.score} من ${res.total} (${fmt(res.score/res.total*100)}%)</div>`:'<div class="m">انتهى وقت الكويز ولم يتم تسجيل محاولة</div>'}${q.status=="open"?'<div class="m">الإجابات الصحيحة هتظهر بعد قفل الكويز.</div>':""}</div>${q.status=="closed"?answers():""}${back}`);
    $("#bk").onclick=stuQuizzes;return;
  }
  const order=q.questions.map(qq=>shuffle(qq.options.map((_,i)=>i)));
  sShell(`<div class="card"><b>${esc(q.title)}</b><div class="m">${esc(q.subject_name)} • الأسبوع ${q.week_no} • محاولة واحدة فقط</div></div>
  ${q.questions.map((qq,i)=>`<div class="card"><b>${i+1}. ${esc(qq.q)}</b>${order[i].map(oi=>`<label class="opt"><input type="radio" name="q${i}" value="${oi}"><span>${esc(qq.options[oi])}</span></label>`).join("")}</div>`).join("")}
  <button class="g" id="sub">إرسال الإجابات</button>${back}<div class="m" id="qm"></div>`);
  $("#bk").onclick=stuQuizzes;
  $("#sub").onclick=async()=>{
    const picked=q.questions.map((_,i)=>{const c=document.querySelector(`input[name=q${i}]:checked`);return c?+c.value:-1});
    const un=picked.filter(x=>x<0).length;
    if(un&&!confirm(`فيه ${un} سؤال من غير إجابة. تبعتي كده؟`))return;
    const score=picked.filter((x,i)=>x===q.questions[i].answer).length;
    $("#sub").disabled=true;
    try{
      await setDoc(doc(db,"quiz_results",`${q.id}_${me.studentId}`),{quiz_id:q.id,student_id:me.studentId,student_name:me.name||"",subject_id:q.subject_id,year:Y,week_no:q.week_no,score,total:q.questions.length,ts:serverTimestamp()});
      sShell(`<div class="card"><b>تم تسجيل إجاباتك ✔</b><div class="ok" style="margin-top:6px">درجتك ${score} من ${q.questions.length} (${fmt(score/q.questions.length*100)}%)</div></div><button class="s" id="bk">رجوع</button>`);
      $("#bk").onclick=stuQuizzes;
    }catch(e){
      $("#qm").textContent=e.code==="permission-denied"?"محاولتك اتسجلت قبل كده أو الكويز اتقفل":(e.message||String(e));
      $("#sub").disabled=false;
    }
  };
}
</script>
</body>
