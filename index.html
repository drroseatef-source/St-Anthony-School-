<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1b2a5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="logo.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>مدرسة القديس اثناسيوس الرسولي للعلوم الكنسية</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin><link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js"><link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js"><link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#1b2a5c;--gold:#e8b93c;--maroon:#7a1f2b;--cream:#f7f0e1;--bg:#fbf7ee;--c:#fff;--t:#23233a;--m:#777;--b:#e4dac4;--ca:rgba(255,255,255,.9)}
@media (prefers-color-scheme:dark){:root{--bg:#14172a;--c:#1f2340;--t:#f1ead8;--m:#b3aa94;--b:#383d63;--cream:#1f2340;--ca:rgba(31,35,64,.88)}}
*{box-sizing:border-box}
body::before,body::after{content:"";position:fixed;left:0;right:0;pointer-events:none;z-index:-1;background-repeat:no-repeat}
body::before{top:0;height:55vh;background-image:url(bg-candles.webp);background-size:cover;background-position:center;opacity:.10;-webkit-mask-image:linear-gradient(#000 35%,transparent);mask-image:linear-gradient(#000 35%,transparent)}
body::after{bottom:0;height:100vh;background-image:url(bg-saint.webp);background-size:contain;background-position:center bottom;opacity:.09;-webkit-mask-image:radial-gradient(ellipse 60% 50% at 50% 42%,#000 35%,transparent 100%);mask-image:radial-gradient(ellipse 60% 50% at 50% 42%,#000 35%,transparent 100%)}
@media (prefers-color-scheme:dark){body::before{opacity:.17}body::after{opacity:.14}}
@media print{body::before,body::after{display:none}}

body{margin:0;font-family:Cairo,system-ui,Tahoma,sans-serif;background:var(--bg);color:var(--t)}
header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:4px solid var(--gold)}
header img{width:72px;height:72px;object-fit:contain}
header b{display:block;font-size:1.05em;font-weight:900}header span{font-size:.75em;color:var(--gold)}
main{max-width:640px;margin:auto;padding:12px}
.card{background:var(--ca);border:1px solid var(--b);border-radius:14px;padding:14px;margin:10px 0}
input,select,button{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--b);background:var(--c);color:var(--t);width:100%;margin:4px 0}
button{background:var(--maroon);color:#fff;border:0;cursor:pointer;font-weight:700}
button.s{background:transparent;color:var(--maroon);border:1px solid var(--maroon)}
button.g{background:var(--gold);color:var(--navy)}
@media (prefers-color-scheme:dark){button.s{color:var(--gold);border-color:var(--gold)}}
nav{display:flex;gap:6px;flex-wrap:wrap}nav button{width:auto;flex:1;min-width:64px}
nav button.on{background:var(--navy)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.m{color:var(--m);font-size:.85em}
.idc{text-align:center;border:3px solid var(--maroon);border-radius:16px;background:var(--cream);padding:14px;position:relative}
.idc img{width:56px}.idc h3{margin:6px 0 0;color:var(--navy)}.idc .n{color:var(--maroon);font-weight:900}
@media (prefers-color-scheme:dark){.idc h3{color:var(--gold)}.idc .n{color:var(--gold)}}
.bar{height:8px;background:var(--b);border-radius:6px;overflow:hidden;margin:4px 0}.bar i{display:block;height:100%;background:var(--navy)}.bar.w i{background:#c0392b}.w{color:#c0392b}.ok{color:#2e7d32}
@media (prefers-color-scheme:dark){.bar i{background:var(--gold)}}

.pa{display:flex;justify-content:center;margin:10px 0}
.pa.sheet{display:grid;grid-template-columns:repeat(auto-fill,85.6mm);gap:4mm;justify-content:center}
.id,.slip{width:85.6mm;height:54mm;border-radius:3mm;overflow:hidden;background:#fbf7ee;color:#23233a;border:.4mm solid #e8b93c;display:flex;flex-direction:column;box-shadow:0 1px 6px #0003;break-inside:avoid;font-family:Cairo,Tahoma,sans-serif;direction:rtl}
.ih{background:#1b2a5c;color:#fff;min-height:14mm;display:flex;align-items:center;gap:2mm;padding:1.4mm 2.5mm;border-bottom:.9mm solid #e8b93c;flex:none}
.ih img{height:10.5mm;width:auto}.ih b{display:block;font-size:2.7mm;line-height:1.4;font-weight:900}.ih span{display:block;font-size:2.2mm;line-height:1.5;color:#e8b93c}.slip .ih span{font-size:3.3mm;font-weight:700}
.ib{flex:1;display:flex;align-items:center;gap:2.5mm;padding:1.5mm 3mm}
.ph{width:22mm;height:29mm;flex:none;border:.5mm solid #7a1f2b;border-radius:1.5mm;overflow:hidden;background:#e4dac4;display:flex;align-items:center;justify-content:center;font-size:9mm}
.ph img{width:100%;height:100%;object-fit:cover}
.in{flex:1;min-width:0;text-align:center}.in h4{margin:0;font-size:4.5mm;line-height:1.4;color:#1b2a5c;font-weight:900}
.in p{margin:.8mm 0 0;font-size:2.6mm;color:#7a1f2b;font-weight:700}.in .cd{font-size:2.8mm;letter-spacing:.3mm;direction:ltr;color:#23233a}
.qr{width:23mm;height:23mm;flex:none;background:#fff;padding:.8mm;border:.3mm solid #e4dac4}.qr img,.qr svg{width:100%;height:100%;display:block}.qr canvas{display:none}
.if{background:#7a1f2b;color:#fff;font-size:2.1mm;text-align:center;height:4mm;line-height:4mm;flex:none}
.slip .sb{flex:1;padding:2.5mm 4mm;display:flex;flex-direction:column;justify-content:center;gap:1.6mm;font-size:3mm}
.slip .sb div{display:flex;justify-content:space-between;align-items:center;border-bottom:.2mm dashed #c9bd9f;padding-bottom:1mm}
.slip .sb code{direction:ltr;font-family:Consolas,monospace;font-size:3.6mm;font-weight:700;color:#7a1f2b}
.slip .sb small{font-size:2.2mm;color:#555;text-align:center;display:block}
@media print{
 body{background:#fff}
 body.printing header,body.printing nav,body.printing .noprint{display:none!important}
 body.printing main>*{display:none!important}
 body.printing main>.pr{display:flex!important}
 body.printing main>.pr.sheet{display:grid!important}
 body.printing main{padding:0;margin:0;max-width:none}
 body.printing .pa{margin:0;justify-content:flex-start}
 body.printing .id,body.printing .slip{box-shadow:none}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cc{position:relative;border:3px solid transparent;border-radius:10px;overflow:hidden;cursor:pointer;background:#000;aspect-ratio:3/4}.cc img{width:100%;height:100%;object-fit:cover;display:block}.cc.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}.cc.lk img{filter:grayscale(1) brightness(.35)}.cc b{position:absolute;bottom:0;left:0;right:0;background:#000a;color:#fff;font-size:.7em;text-align:center;padding:2px}.cc .x{position:absolute;top:4px;right:4px;background:var(--gold);color:var(--navy);border-radius:10px;padding:0 6px;font-size:.75em;font-weight:900}
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0;display:flex;gap:6px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--b)}.topbar button{width:auto;flex:1;margin:0}.topbar .m{width:100%;margin:0}
textarea{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--b);background:var(--c);color:var(--t);width:100%;margin:4px 0}
nav{flex-wrap:wrap}nav button{min-width:76px}
a{color:var(--maroon);font-weight:700;text-decoration:none}
@media (prefers-color-scheme:dark){a{color:var(--gold)}}
.new{background:#c0392b;color:#fff;border-radius:8px;padding:0 8px;font-size:.75em;white-space:nowrap}
.opt{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--b);cursor:pointer}.opt input{width:auto;margin:0;flex:none}
pre.ex{background:var(--bg);border:1px dashed var(--b);border-radius:10px;padding:8px;margin:4px 0;font:inherit;font-size:.85em;white-space:pre-wrap;direction:rtl}
.rvt{width:100%;border-collapse:collapse}.rvt th,.rvt td{border:1px solid var(--b);padding:5px 8px;text-align:right;font-size:.85em}
@media print{.rvt th,.rvt td{color:#000;border-color:#888}}
</style>
</head>
<body>
<header><img src="logo.png" alt=""><div><b>مدرسة القديس اثناسيوس الرسولي للعلوم الكنسية</b><span>كنيسة رئيس الملائكة الجليل ميخائيل ببهتيم</span></div></header>
<main id="app"><div class="card m" style="text-align:center">جاري التحميل...</div></main>

const CACHE=new Map(),CACHEABLE=new Set(["students","batches","subjects"]);let GEN=0;
const bust=r=>{const p=String((r&&r.path)||"");if(!p||/^(students|batches|subjects)(\/|$)/.test(p)){GEN++;CACHE.clear()}};

const list=async q=>{
  const k=q&&q.type==="collection"&&CACHEABLE.has(q.path)?q.path:null;
  if(k){const c=CACHE.get(k);if(c&&Date.now()-c.t<60000)return c.v.map(x=>({...x}))}
  const g=GEN,v=(await getDocs(q)).docs.map(d=>({id:d.id,...d.data()}));

  return k?v.map(x=>({...x})):v;
};
const fmt=n=>Math.round(n*10)/10;
const SUBJ=[["عهد قديم",1],["طقس",1],["عهد جديد",2],["تاريخ كنيسة",2],["عقيدة",3],["لاهوت مقارن",3],["لاهوت دفاعي",4],["قبطي",4]];

/* ---------- أدوات مساعدة (بدون اتصال بالسيرفر) ---------- */
const ar2en=v=>String(v??"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));
const normPhone=v=>{let d=ar2en(v).replace(/[^\d]/g,"");if(d.length==10&&d[0]=="1")d="0"+d;return d};
const toISO=v=>{
  if(typeof v==="number"&&v>1000&&v<100000)return new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5).toISOString().slice(0,10);
  const m=ar2en(v).match(/(\d{1,2})\s*[\/\-\.]\s*(\d{1,2})\s*[\/\-\.]\s*(\d{4})/);
  if(!m)return "";
  const d=+m[1],mo=+m[2];if(mo<1||mo>12||d<1||d>31)return "";
  return `${m[3]}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
};
const stageDur=t=>{t=String(t??"");return /ثالث/.test(t)?1:/ثاني/.test(t)?2:/[أا]ول/.test(t)?3:null};
const clean=v=>String(v??"").replace(/\s+/g," ").trim();
const wordsOf=n=>clean(n).split(" ").filter(Boolean).length;
function missingOf(s){
  const m=[];
  if(wordsOf(s.full_name)<3)m.push("الاسم غير كامل");
  if(!(s.phones&&s.phones.length))m.push("التليفون");
  else if(s.phones.some(p=>p.length!=11))m.push("رقم التليفون غير مكتمل");
  if(!s.address)m.push("العنوان");
  if(!s.birth_date)m.push("تاريخ الميلاد");
  if(!s.confession_father)m.push("أب الاعتراف");
  if(!s.church)m.push("الكنيسة");
  return m;
}
function rowToStudent(r){
  const g=k=>{const key=Object.keys(r).find(x=>clean(x).replace(/\s*\(.*\)/,"")==k);return key?r[key]:""};
  const ph=normPhone(g("التليفون"));
  return {full_name:clean(g("الاسم رباعي")),phones:ph?[ph]:[],birth_date:toISO(g("تاريخ الميلاد")),address:clean(g("العنوان")),confession_father:clean(g("أب الاعتراف")),church:clean(g("الكنيسة")),stage:clean(g("المرحلة"))};
}
function parseQuiz(text){
  const qs=[],errs=[];
  String(text).replace(/\r/g,"").split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean).forEach((b,i)=>{
    const lines=b.split("\n").map(x=>x.trim()).filter(Boolean);
    const q=lines.shift().replace(/^\d+\s*[\.\-\)]\s*/,"");
    const options=[];let ans=-1,stars=0;
    lines.forEach(l=>{
      if(!/^[-•]/.test(l))return;
      let t=l.replace(/^[-•]\s*/,"").trim();
      if(/[*✓✔]$/.test(t)){t=t.replace(/\s*[*✓✔]+$/,"").trim();ans=options.length;stars++}
      if(t)options.push(t);
    });
    if(options.length<2)errs.push(`سؤال ${i+1}: لازم اختيارين على الأقل`);
    else if(stars!=1)errs.push(`سؤال ${i+1}: لازم تحددي إجابة واحدة صح بعلامة *`);
    else qs.push({q,options,answer:ans});
  });
  return {qs,errs};
}
const quizToText=qs=>qs.map(q=>q.q+"\n"+q.options.map((o,i)=>"- "+o+(i==q.answer?" *":"")).join("\n")).join("\n\n");
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- الدخول ---------- */
onAuthStateChanged(auth,u=>{ if(signingUp)return; u?route(u):login() });

async function route(u){
  try{
    const [s,st]=await Promise.all([getDoc(doc(db,"users",u.uid)),getDoc(doc(db,"settings","main")).catch(()=>null)]);
    if(!s.exists()){await signOut(auth);return login("الحساب ده مش مفعّل، كلمي الأدمن")}
    me=s.data();role=me.role;
    if(st&&st.exists())Y=st.data().year;
    if(role==="admin"){if(!(st&&st.exists()))await ensureSeed();admin()}else student();
  }catch(e){login("حصل خطأ: "+(e.message||e))}
}
async function ensureSeed(){
  const subs=await getDocs(col("subjects"));
  if(!subs.empty)return;
  const b=writeBatch(db);
  SUBJ.forEach(([name,term],i)=>b.set(doc(db,"subjects","s"+(i+1)),{name,term,sort:i+1}));
  b.set(doc(db,"settings","main"),{year:Y});

function calc(subs,lecs,atts){
  const rows=[];
  [...subs].sort((a,b)=>a.term-b.term||a.sort-b.sort).forEach(s=>{
    const total=lecs.filter(l=>l.subject_id==s.id).length;if(!total)return;

async function startScanner(elId,onCode){
  const box=$("#"+elId);
  if("BarcodeDetector" in window){
    let stream=null;
    try{
      const f=await BarcodeDetector.getSupportedFormats();
      if(f.includes("qr_code")){
        const det=new BarcodeDetector({formats:["qr_code"]});
        stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false});
        const v=document.createElement("video");v.setAttribute("playsinline","");v.muted=true;v.srcObject=stream;
        v.style.cssText="width:100%;max-height:60vh;object-fit:cover;border-radius:10px;background:#000";
        box.innerHTML="";box.appendChild(v);await v.play();
        let on=true,busy=false;
        const t=setInterval(async()=>{if(!on||busy||v.readyState<2)return;busy=true;try{const r=await det.detect(v);if(r.length&&r[0].rawValue)onCode(r[0].rawValue)}catch(e){}busy=false},150);
        return {stop:async()=>{on=false;clearInterval(t);stream.getTracks().forEach(x=>x.stop());box.innerHTML=""}};
      }
    }catch(e){
      if(stream)stream.getTracks().forEach(x=>x.stop());
      if(e&&(e.name=="NotAllowedError"||e.name=="NotFoundError"||e.name=="NotReadableError"))throw e;
    }
  }
  await libScan();
  const q=new Html5Qrcode(elId,{verbose:false,experimentalFeatures:{useBarCodeDetectorIfSupported:true}});
  await q.start({facingMode:"environment"},{fps:10,qrbox:(w,h)=>{const m=Math.floor(Math.min(w,h)*.75);return{width:m,height:m}}},t=>onCode(t));
  return {stop:async()=>{try{await q.stop()}catch(e){}}};
}
async function scanner(lec,title){
  const ex=await list(query(col("attendance"),where("lecture_id","==",lec.id)));

  app.innerHTML=`<div class="card"><b>${esc(title)}</b><div id="rd" style="width:100%;margin:8px 0"></div><div id="msg" class="m">وجّهي الكاميرا على الـ QR</div>

  let last="",lt=0;

    last=code;lt=Date.now();
    if(!/^[A-Z0-9]{4,20}$/.test(code)){$("#msg").innerHTML=`<span class="w">كود غير معروف: ${esc(code.slice(0,30))}</span>`;return}
    try{

      if((await getDoc(doc(db,"attendance",aid))).exists()){$("#msg").innerHTML=`<span class="w">${esc(s.full_name)} مسجل قبل كده</span>`;return}
      await setDoc(doc(db,"attendance",aid),{lecture_id:lec.id,student_id:code,student_name:s.full_name,subject_id:lec.subject_id,year:Y,week_no:lec.week_no,ts:serverTimestamp()});
      names.push(s.full_name);draw();navigator.vibrate&&navigator.vibrate(120);$("#msg").innerHTML=`<span class="ok">✔ ${esc(s.full_name)}</span>`;
    }catch(e){$("#msg").textContent=e.message||String(e)}
  };
  $("#mb").onclick=()=>{mark($("#mc").value);$("#mc").value=""};
  const stl=(await list(col("students"))).filter(isActive);

    $("#sr").innerHTML=q?stl.filter(x=>x.full_name.includes(q)).slice(0,6).map(x=>`<button class="s" data-k="${esc(x.id)}">${esc(x.full_name)}</button>`).join(""):"";
    document.querySelectorAll("#sr [data-k]").forEach(b=>b.onclick=()=>{mark(b.dataset.k);$("#sq").value="";$("#sr").innerHTML=""});
  };
  let sc=null;
  $("#st").onclick=async()=>{try{sc&&await sc.stop()}catch(e){}attendance()};

/* ---------- الكروت والنقاط (XP) ---------- */
const CARDS=[
 {id:"love",n:"المحبة",r:"أسطوري",xp:500},
 {id:"joy",n:"الفرح",r:"شائع",xp:100},
 {id:"peace",n:"السلام",r:"نادر",xp:300},
 {id:"patience",n:"طول الأناة",r:"شائع",xp:100},
 {id:"kindness",n:"اللطف",r:"شائع",xp:100},
 {id:"goodness",n:"الصلاح",r:"شائع",xp:100},
 {id:"faith",n:"الإيمان",r:"نادر",xp:300},
 {id:"gentleness",n:"الوداعة",r:"شائع",xp:100},
 {id:"selfcontrol",n:"التعفف",r:"شائع",xp:100}];
const EARLY={id:"early",n:"إليك أبكر",r:"نشاط",xp:200};
const ALLC=[EARLY,...CARDS],cardOf=id=>ALLC.find(c=>c.id==id);
const SET_XP=CARDS.reduce((a,c)=>a+c.xp,0),EARLY_NEED=4,BONUS=SET_XP+EARLY_NEED*EARLY.xp;
const LEVELS=[[0,"المستوى 1","التلميذ"],[1000,"المستوى 2","المستكشف"],[2500,"المستوى 3","الخبير (Expert)"]];
const levelOf=x=>{let i=0;LEVELS.forEach((l,k)=>{if(x>=l[0])i=k});return i};
const cimg=id=>`${id}.webp`;
const egp=x=>(Math.round(x/10*10)/10).toLocaleString("en");
function cairoNow(d=new Date()){
  const p=Object.fromEntries(new Intl.DateTimeFormat("en-GB",{timeZone:"Africa/Cairo",year:"numeric",month:"2-digit",day:"2-digit",weekday:"short",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(d).map(x=>[x.type,x.value]));
  return {date:`${p.year}-${p.month}-${p.day}`,wd:p.weekday,mins:(+p.hour)*60+(+p.minute)};
}
const inEarlyWindow=()=>{const c=cairoNow();return c.wd==="Fri"&&c.mins>=800&&c.mins<810};   // الجمعة 1:20 - 1:30
function tally(logs){
  const fruits=new Set();let early=0,earned=0,spent=0,bonus=false;
  logs.forEach(l=>{const x=Number(l.xp)||0;
    if(l.type=="spend")spent+=x;
    else{earned+=x;if(l.type=="bonus")bonus=true;else if(l.card_id=="early")early++;else fruits.add(l.card_id)}});
  return {fruits,early,earned,spent,wallet:earned-spent,lvl:levelOf(earned),bonus};
}
const myLogs=code=>list(query(col("xp_log"),where("student_id","==",code),where("year","==",Y)));
async function syncBonus(code,name){
  const t=tally(await myLogs(code)),ok=t.fruits.size>=CARDS.length&&t.early>=EARLY_NEED,bid=`${Y}_${code}_bonus`;
  if(ok&&!t.bonus){await setDoc(doc(db,"xp_log",bid),{student_id:code,student_name:name,type:"bonus",card_id:"",xp:BONUS,year:Y,date:cairoNow().date,ts:serverTimestamp(),note:"بونص اكتمال المجموعة"});return "granted"}
  if(!ok&&t.bonus){await deleteDoc(doc(db,"xp_log",bid));return "removed"}
  return "";
}

function buildExport(D,opt){
  const {subs,lecs,atts,qz,qr,xp,bs}=D;
  const bn=Object.fromEntries(bs.map(b=>[b.id,b.name]));
  const st=D.st.filter(s=>(opt.wd||isActive(s))&&(!opt.batch||s.batch_id==opt.batch))
    .sort((a,b)=>String(a.batch_name||"").localeCompare(String(b.batch_name||""),"ar")||(a.seq||0)-(b.seq||0)||String(a.full_name).localeCompare(String(b.full_name),"ar"));
  const by=(arr,k)=>{const m=new Map();arr.forEach(x=>{const a=m.get(x[k])||[];a.push(x);m.set(x[k],a)});return m};
  const attBy=by(atts,"student_id"),xpBy=by(xp,"student_id");
  const subOrd=[...subs].sort((a,b)=>a.term-b.term||a.sort-b.sort),sIdx=Object.fromEntries(subOrd.map((s,i)=>[s.id,i]));
  const subCols=calc(subs,lecs,[]);                     // المواد اللي ليها محاضرات
  const lecOrd=[...lecs].sort((a,b)=>(sIdx[a.subject_id]??99)-(sIdx[b.subject_id]??99)||a.week_no-b.week_no);
  const qzOrd=qz.filter(q=>q.status!="draft").sort((a,b)=>(sIdx[a.subject_id]??99)-(sIdx[b.subject_id]??99)||a.week_no-b.week_no);
  const resKey=new Set(qr.map(r=>r.quiz_id+"|"+r.student_id)),resMap=new Map(qr.map(r=>[r.quiz_id+"|"+r.student_id,r]));
  const lecAtt=new Set(atts.map(a=>a.lecture_id+"|"+a.student_id));
  const avg=a=>a.length?fmt(a.reduce((x,y)=>x+y,0)/a.length):"";
  const num=(i)=>i+1;
  // حسابات لكل مخدوم
  const info=st.map(s=>{
    const rows=calc(subs,lecs,attBy.get(s.id)||[]);
    const t=tally(xpBy.get(s.id)||[]);
    let qs=0,qt=0;qzOrd.forEach(q=>{qt+=(q.questions||[]).length;const r=resMap.get(q.id+"|"+s.id);if(r)qs+=Number(r.score)||0});
    return {s,rows,t,pct:avg(rows.map(r=>r.attendance_pct)),grade:avg(rows.map(r=>r.attendance_grade)),warn:rows.filter(r=>r.warning).length,qs,qt,qp:qt?fmt(qs/qt*100):""};
  });
  const base=(x,i)=>[num(i),x.s.full_name,x.s.batch_name||bn[x.s.batch_id]||""];
  const sheets={};
  sheets.summary={name:"ملخص عام",rows:[["م","الاسم","الدفعة","متوسط الحضور %","درجة الحضور (من 25)","مواد فيها إنذار","نسبة الكويزات %","مستوى الـ XP","إجمالي XP"],
    ...info.map((x,i)=>[...base(x,i),x.pct,x.grade,x.warn,x.qp,LEVELS[x.t.lvl][2],x.t.earned])],w:[5,30,18,14,16,14,14,16,12]};
  sheets.students={name:"المخدومين",rows:[["م","الاسم","الدفعة","الكود","التليفون","تاريخ الميلاد","العنوان","أب الاعتراف","الكنيسة","الحالة"],
    ...info.map((x,i)=>[x.s.seq||num(i),x.s.full_name,x.s.batch_name||bn[x.s.batch_id]||"",x.s.code||x.s.id,(x.s.phones||[]).join("، "),x.s.birth_date||"",x.s.address||"",x.s.confession_father||"",x.s.church||"",isActive(x.s)?"نشط":"منسحب"])],
    w:[6,30,18,14,18,12,28,18,22,8]};
  sheets.att={name:"ملخص الحضور",rows:[["م","الاسم","الدفعة",...subCols.flatMap(c=>[`${c.subject_name} - حضر (من ${c.total_lectures})`,`${c.subject_name} %`]),"متوسط الحضور %","درجة الحضور (من 25)","إنذار"],
    ...info.map((x,i)=>{const m=Object.fromEntries(x.rows.map(r=>[r.subject_name,r]));
      return [...base(x,i),...subCols.flatMap(c=>{const r=m[c.subject_name];return [r?r.attended:0,r?r.attendance_pct:0]}),x.pct,x.grade,x.warn?"إنذار":""]})],
    w:[5,30,18,...subCols.flatMap(()=>[14,10]),14,16,8]};
  sheets.attd={name:"تفصيل الحضور",rows:[["م","الاسم","الدفعة",...lecOrd.map(l=>`${l.subject_name} - أسبوع ${l.week_no}`)],
    ...info.map((x,i)=>[...base(x,i),...lecOrd.map(l=>lecAtt.has(l.id+"|"+x.s.id)?"✔":"✘")])],w:[5,30,18,...lecOrd.map(()=>14)]};
  sheets.quiz={name:"الكويزات",rows:[["م","الاسم","الدفعة",...qzOrd.map(q=>`${q.subject_name} - أسبوع ${q.week_no} (من ${(q.questions||[]).length})`),"المجموع","إجمالي الدرجات","النسبة %"],
    ...info.map((x,i)=>[...base(x,i),...qzOrd.map(q=>{const r=resMap.get(q.id+"|"+x.s.id);return r?Number(r.score)||0:""}),x.qs,x.qt,x.qp])],
    w:[5,30,18,...qzOrd.map(()=>16),10,14,10]};
  sheets.xp={name:"نقاط XP",rows:[["م","الاسم","الدفعة","المستوى","إجمالي XP","المصروف XP","الرصيد XP","الرصيد بالجنيه",`ثمار الروح (من ${CARDS.length})`,"عدد إليك أبكر","البونص"],
    ...info.map((x,i)=>[...base(x,i),LEVELS[x.t.lvl][2],x.t.earned,x.t.spent,x.t.wallet,fmt(x.t.wallet/10),x.t.fruits.size,x.t.early,x.t.bonus?"تم":""])],w:[5,30,18,16,12,12,12,14,16,14,8]};
  return sheets;
}

async function shrink(file){
  let im;
  try{im=await createImageBitmap(file)}
  catch(e){   // طريقة بديلة لو الأولى فشلت
    im=await new Promise((ok,no)=>{const u=URL.createObjectURL(file),t=new Image();
      t.onload=()=>{URL.revokeObjectURL(u);ok(t)};
      t.onerror=()=>{URL.revokeObjectURL(u);no(new Error("الصورة دي مش قابلة للقراءة (ممكن تكون HEIC أو لسه ما اتحمّلتش من الجاليري)"))};
      t.src=u});
  }
  const iw=im.width||im.naturalWidth,ih=im.height||im.naturalHeight;
  if(!iw||!ih)throw new Error("الصورة فاضية أو تالفة");
  const W=240,H=320,c=document.createElement("canvas");c.width=W;c.height=H;
  const k=Math.max(W/iw,H/ih),w=iw*k,h=ih*k;
  c.getContext("2d").drawImage(im,(W-w)/2,(H-h)/2,w,h);
  return c.toDataURL("image/jpeg",.72);
}

async function previewImport(rows){

  const names=new Set(ex.map(s=>clean(s.full_name)));
  const items=rows.map(r=>({...r,dur:stageDur(r.stage),dup:names.has(r.full_name)}));

  ${items.map(r=>{const mi=missingOf(r);return `<div class="card" style="opacity:${r.dur&&!r.dup?1:.5}"><b>${esc(r.full_name)}</b> <span class="m">${esc(r.stage)}${r.dur?"":" ⚠ مرحلة غير مفهومة"}${r.dup?" • موجود قبل كده":""}</span>${mi.length?`<div class="w" style="font-size:.8em">⚠ ناقص: ${esc(mi.join("، "))}</div>`:""}</div>`}).join("")}
  <button class="g" id="doimp" ${ok.length?"":"disabled"}>استيراد ${ok.length} مخدوم</button><div id="ip" class="m"></div>`;
  $("#doimp").onclick=async()=>{

async function setStatus(s,status){
  const b=writeBatch(db);
  b.set(doc(db,"students",s.id),status=="withdrawn"?{status:"withdrawn",withdrawn_at:Date.now()}:{status:"active",withdrawn_at:0},{merge:true});
  if(s.user_id){
    if(status=="withdrawn")b.delete(doc(db,"users",s.user_id));
    else b.set(doc(db,"users",s.user_id),{role:"student",studentId:s.id,name:s.full_name});
  }
  await b.commit();
  idcard({...s,status});
}
async function recreateAccount(s){
  if(!confirm(`إعادة إنشاء حساب ${s.full_name}؟\nهيتعمل اسم مستخدم وكلمة مرور جداد، والقديمين هيبطلوا يشتغلوا. الحضور والنتايج بيفضلوا زي ما هما.`))return;
  const a2=secondAuth(),pw=genPw();let uid=null,user;
  try{
    for(let i=0;i<5&&!uid;i++){
      user=genUser();
      try{uid=(await createUserWithEmailAndPassword(a2,mail(user),pw)).user.uid}
      catch(e){if(e.code!=="auth/email-already-in-use")throw e}
    }
    if(!uid)throw new Error("تعذر إنشاء اسم مستخدم، حاولي مرة أخرى");
    await signOut(a2);
    const b=writeBatch(db);
    b.set(doc(db,"students",s.id),{user_id:uid,username:user,init_pw:pw},{merge:true});
    if(s.user_id)b.delete(doc(db,"users",s.user_id));
    b.set(doc(db,"users",uid),{role:"student",studentId:s.id,name:s.full_name});
    await b.commit();
  }catch(e){alert("حصلت مشكلة: "+(e.message||e));return}
  idcard({...s,user_id:uid,username:user,init_pw:pw});
}
async function deleteStudent(s){
  if(!confirm(`حذف ${s.full_name} نهائيًا مع كل حضوره ونتائجه؟ مفيش رجوع.`))return;
  const [att,qr]=await Promise.all([list(query(col("attendance"),where("student_id","==",s.id))),list(query(col("quiz_results"),where("student_id","==",s.id)))]);
  const refs=[...att.map(a=>doc(db,"attendance",a.id)),...qr.map(a=>doc(db,"quiz_results",a.id)),doc(db,"students",s.id)];
  if(s.user_id)refs.push(doc(db,"users",s.user_id));
  for(let i=0;i<refs.length;i+=400){const b=writeBatch(db);refs.slice(i,i+400).forEach(r=>b.delete(r));await b.commit()}
  admin();
}

  <select id="mk"><option value="video">🎬 فيديو</option><option value="pdf">📄 PDF</option><option value="other">📎 ملف آخر</option></select>
  <button id="addm" class="g">إضافة</button></div>
  ${grouped.map(g=>`<div class="card"><b>${esc(g.s.name)}</b>${g.items.map(m=>`<div class="row" style="margin-top:8px"><a href="${esc(m.url)}" target="_blank" rel="noopener">${KIND[m.kind]||"📎"} الأسبوع ${m.week_no} - ${esc(m.title)}</a><button class="s" style="width:auto;padding:4px 10px" data-dm="${esc(m.id)}">حذف</button></div>`).join("")}</div>`).join("")}
  <div class="card"><b>${e?"تعديل كويز (مسودة)":"كويز جديد"}</b>
  <select id="qsj">${sOpt(e?.subject_id)}</select><select id="qwk">${wOpt(e?.week_no)}</select>
  <input id="qt" placeholder="عنوان الكويز" value="${esc(e?.title||"")}">
  <div class="m">الصقي الأسئلة بالشكل ده: سطر السؤال، وتحته الاختيارات كل واحد بشرطة، والإجابة الصح بعلامة * في آخرها، وسطر فاضي بين كل سؤالين.</div>
  <pre class="ex">ما هو أول أسفار العهد القديم؟
- التكوين *
- الخروج
- اللاويين</pre>
  <textarea id="qx" rows="10" placeholder="الأسئلة هنا">${esc(e?quizToText(e.questions):"")}</textarea>
  <button id="qpv" class="s">معاينة</button><div id="qpr"></div><button id="qsv" class="g">${e?"حفظ التعديل":"حفظ كمسودة"}</button>${e?'<button id="qcx" class="s">إلغاء التعديل</button>':""}</div>
  ${qz.sort((a,b)=>b.at-a.at).map(q=>`<div class="card"><div class="row"><b>${esc(q.title)}</b><span class="m">${STATUS[q.status]||""}</span></div><div class="m">${esc(q.subject_name)} • الأسبوع ${q.week_no} • ${q.questions.length} سؤال</div>
  <div class="row" style="gap:6px;margin-top:6px">${q.status=="draft"?`<button class="g" data-qa="pub:${esc(q.id)}">نشر</button><button class="s" data-qa="edit:${esc(q.id)}">تعديل</button>`:q.status=="open"?`<button class="s" data-qa="close:${esc(q.id)}">إغلاق</button>`:`<button class="s" data-qa="pub:${esc(q.id)}">فتح تاني</button>`}${q.status!="draft"?`<button class="s" data-qa="res:${esc(q.id)}">النتائج</button>`:""}<button class="s" data-qa="del:${esc(q.id)}">حذف</button></div></div>`).join("")}`);

  $("#addm").onclick=async()=>{
    const url=$("#mu").value.trim(),title=clean($("#mt").value);
    if(!title)return alert("اكتبي عنوان");
    if(!/^https:\/\//.test(url))return alert("اللينك لازم يبدأ بـ https://");
    const s=subs.find(x=>x.id==$("#msj").value);
    await addDoc(col("materials"),{year:Y,subject_id:s.id,subject_name:s.name,week_no:+$("#mwk").value,title,url,kind:$("#mk").value,at:Date.now()});
    content();
  };
  document.querySelectorAll("[data-dm]").forEach(b=>b.onclick=async()=>{if(confirm("حذف المادة دي؟")){await deleteDoc(doc(db,"materials",b.dataset.dm));content()}});

  const preview=()=>{
    const r=parseQuiz($("#qx").value);
    $("#qpr").innerHTML=`<div class="m">${r.qs.length} سؤال سليم</div>${r.errs.map(x=>`<div class="w">${esc(x)}</div>`).join("")}${r.qs.map((q,i)=>`<div class="card"><b>${i+1}. ${esc(q.q)}</b>${q.options.map((o,j)=>`<div class="${j==q.answer?"ok":""}">${j==q.answer?"✔":"•"} ${esc(o)}</div>`).join("")}</div>`).join("")}`;
    return r;
  };
  $("#qpv").onclick=preview;
  $("#qsv").onclick=async()=>{
    const r=preview(),title=clean($("#qt").value);
    if(!title)return alert("اكتبي عنوان الكويز");
    if(r.errs.length||!r.qs.length)return alert("صلحي الأخطاء الأول");
    const s=subs.find(x=>x.id==$("#qsj").value);
    const data={year:Y,subject_id:s.id,subject_name:s.name,week_no:+$("#qwk").value,title,questions:r.qs};
    if(e)await updateDoc(doc(db,"quizzes",e.id),data);
    else await addDoc(col("quizzes"),{...data,status:"draft",at:Date.now()});
    editQ=null;content();
  };
  if($("#qcx"))$("#qcx").onclick=()=>{editQ=null;content()};
  document.querySelectorAll("[data-qa]").forEach(b=>b.onclick=async()=>{
    const [a,id]=b.dataset.qa.split(":"),q=qz.find(x=>x.id==id);
    if(a=="pub"){await updateDoc(doc(db,"quizzes",id),{status:"open"});content()}
    else if(a=="close"){await updateDoc(doc(db,"quizzes",id),{status:"closed"});content()}
    else if(a=="edit"){editQ=id;content()}
    else if(a=="del"){if(confirm("حذف الكويز ده؟ النتائج المسجلة هتفضل في قاعدة البيانات.")){await deleteDoc(doc(db,"quizzes",id));content()}}
    else if(a=="res")quizResults(q);
  });
}
async function quizResults(q){
  const [rs,sts,bts]=await Promise.all([list(query(col("quiz_results"),where("quiz_id","==",q.id))),list(col("students")),list(col("batches"))]);
  const act=new Set(bts.filter(b=>b.entry_year<=Y&&Y<b.entry_year+b.duration_years).map(b=>b.id));
  const rows=sts.filter(s=>act.has(s.batch_id)&&isActive(s)).sort(arSort).map(s=>({s,r:rs.find(x=>x.student_id==s.id)}));
  const done=rows.filter(x=>x.r),avg=done.length?fmt(done.reduce((a,x)=>a+x.r.score/x.r.total*100,0)/done.length):0;
  app.innerHTML=`<div class="topbar noprint"><button class="s" id="bk">→ رجوع</button></div><div class="card"><b>${esc(q.title)}</b><div class="m">${esc(q.subject_name)} • الأسبوع ${q.week_no}</div><div class="m">حلّ ${done.length} من ${rows.length} • المتوسط ${avg}%</div></div>
  ${rows.map(({s,r})=>`<div class="card row"><div>${esc(s.full_name)}<div class="m">${esc(s.batch_name)}</div></div><div>${r?`<b>${r.score}/${r.total}</b> <span class="m">${fmt(r.score/r.total*100)}%</span> <button class="s" style="width:auto;padding:4px 8px" data-rm="${esc(r.id)}">إعادة</button>`:'<span class="m">لم يحل</span>'}</div></div>`).join("")}`;
  $("#bk").onclick=()=>{tab="content";admin()};
  document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=async()=>{if(confirm("مسح نتيجة المخدوم عشان يحل الكويز تاني؟")){await deleteDoc(doc(db,"quiz_results",b.dataset.rm));quizResults(q)}});
}

/* ---------- شاشة المخدوم ---------- */
let sTab="home";
const seen=(k,set)=>{try{const key=`seen_${k}_${me.studentId}`;if(set){localStorage.setItem(key,String(set));return 0}return +localStorage.getItem(key)||0}catch(e){return 0}};
function sShell(body){
  app.innerHTML=`<nav><button class="${sTab=="home"?"on":"s"}" data-s="home">الرئيسية</button><button class="${sTab=="cards"?"on":"s"}" data-s="cards">🃏 كروتي</button><button class="${sTab=="mat"?"on":"s"}" data-s="mat">المادة العلمية</button><button class="${sTab=="quiz"?"on":"s"}" data-s="quiz">الكويزات</button></nav>${body}`;
  document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{sTab=b.dataset.s;student()});
}
const student=()=>sTab=="cards"?stuCards():sTab=="mat"?stuMaterials():sTab=="quiz"?stuQuizzes():stuHome();

async function stuHome(){
  const code=me.studentId;
  const sd=await getDoc(doc(db,"students",code));
  const s=sd.exists()?sd.data():null;
  let rows=[];
  if(s){
    const [subs,lecs,atts]=await Promise.all([list(col("subjects")),list(query(col("lectures"),where("year","==",Y))),list(query(col("attendance"),where("student_id","==",code),where("year","==",Y)))]);
    rows=calc(subs,lecs,atts);
  }
  const first=s?String(s.full_name||"").trim().split(/\s+/)[0]:"";
  const bday=s&&bdayToday(s)?`<div class="card" style="text-align:center"><div style="font-size:2em">🎂🎉</div><b>عيد ميلاد سعيد يا ${esc(first)}!</b><div class="m" style="margin-top:6px">ربنا يفرّح قلبك ويبارك في عمرك ويحفظك في محبته طول أيام حياتك. كل سنة وإنت في رعاية ربنا 🙏</div></div>`:"";
  sShell(`${bday}<div class="pa">${s?cardHtml(s):"حسابك لسه مش مربوط ببيانات مخدوم، كلمي الأدمن."}</div>${s?`<div class="card"><b>حضوري</b>${rows.map(r=>`<div class="${r.warning?"w":""}"><div class="row"><span>${esc(r.subject_name)}</span><span>${r.attended}/${r.total_lectures} • ${r.attendance_pct}%${r.warning?" ⚠":""}</span></div><div class="bar ${r.warning?"w":""}"><i style="width:${r.attendance_pct}%"></i></div></div>`).join("")||'<div class="m">لسه مفيش محاضرات متسجلة</div>'}</div>`:""}<button class="s" id="pw">تغيير كلمة المرور</button><button class="s" id="out">خروج</button>`);
  $("#pw").onclick=changePw;
  renderQR();
  $("#out").onclick=()=>signOut(auth);
}
async function stuCards(){
  const code=me.studentId;
  const logs=await myLogs(code),t=tally(logs),li=t.lvl,nx=LEVELS[li+1],base=LEVELS[li][0];
  const pct=nx?Math.min(100,(t.earned-base)/(nx[0]-base)*100):100;
  const cnt={};logs.forEach(l=>{if(l.type=="card")cnt[l.card_id]=(cnt[l.card_id]||0)+1});
  const left=CARDS.length-t.fruits.size,needE=Math.max(0,EARLY_NEED-t.early);
  sShell(`<div class="card" style="text-align:center"><div class="m">${LEVELS[li][1]}</div><div style="font-size:1.5em;font-weight:900">${LEVELS[li][2]}</div>
   <div class="row"><b>${t.earned} XP</b><span class="m">${nx?`${nx[2]} عند ${nx[0]} XP`:"أعلى مستوى 🏆"}</span></div><div class="bar"><i style="width:${pct}%"></i></div>
   <div class="row" style="margin-top:6px"><span>💰 رصيدك</span><b>${t.wallet} XP <span class="m">(= ${egp(t.wallet)} جنيه)</span></b></div></div>
  <div class="card"><div class="row"><b>🍇 ثمار الروح القدس</b><b>${t.fruits.size}/${CARDS.length}</b></div>
   <div class="cg" style="margin-top:8px">${CARDS.map(c=>`<div class="cc ${t.fruits.has(c.id)?"":"lk"}" data-c="${c.id}"><img src="${cimg(c.id)}" loading="lazy" decoding="async" alt="${esc(c.n)}"><b>${t.fruits.has(c.id)?esc(c.n):"🔒"}</b></div>`).join("")}</div></div>
  <div class="card"><div class="row"><b>⏰ إليك أبكر</b><b>${t.early}</b></div>
   <div class="cg" style="margin-top:8px;grid-template-columns:repeat(3,1fr)"><div class="cc ${t.early?"":"lk"}" data-c="early"><img src="${cimg("early")}" loading="lazy" decoding="async" alt="إليك أبكر">${t.early?`<span class="x">×${t.early}</span>`:""}</div></div></div>
  <div class="card">${t.bonus?`<b class="ok">🎉 خدت بونص اكتمال المجموعة +${BONUS} XP</b>`:`<b>🎁 بونص ${BONUS} XP</b><div class="m">كمّل كل كروت الثمار (فاضل ${left}) وخد ${EARLY_NEED} كروت من إليك أبكر على الأقل (فاضل ${needE}).</div>`}</div>`);
  document.querySelectorAll("[data-c]").forEach(e=>e.onclick=()=>{
    const id=e.dataset.c;if(id=="early"?!t.early:!t.fruits.has(id))return;
    const o=document.createElement("div");o.style.cssText="position:fixed;inset:0;background:#000d;z-index:50;display:flex;align-items:center;justify-content:center";
    o.innerHTML=`<img src="${cimg(id)}" alt="" style="max-width:92%;max-height:92%;border-radius:12px">`;o.onclick=()=>o.remove();document.body.appendChild(o);
  });
}
async function stuMaterials(){
  const [subs,ms]=await Promise.all([list(col("subjects")),list(query(col("materials"),where("year","==",Y)))]);
  const ls=seen("mat");
  subs.sort((a,b)=>a.term-b.term||a.sort-b.sort);
  const g=subs.map(s=>({s,items:ms.filter(m=>m.subject_id==s.id&&/^https:\/\//.test(m.url)).sort((a,b)=>a.week_no-b.week_no||a.at-b.at)})).filter(x=>x.items.length);
  sShell(g.map(x=>`<div class="card"><b>${esc(x.s.name)}</b>${x.items.map(m=>`<div class="row" style="margin-top:8px"><a href="${esc(m.url)}" target="_blank" rel="noopener">${KIND[m.kind]||"📎"} الأسبوع ${m.week_no} - ${esc(m.title)}</a>${m.at>ls?'<span class="new">جديد</span>':""}</div>`).join("")}</div>`).join("")||'<div class="card m">لسه مفيش مواد علمية</div>');
  seen("mat",Date.now());
}
async function stuQuizzes(){
  const code=me.studentId;
  const [o,c,rs]=await Promise.all([list(query(col("quizzes"),where("year","==",Y),where("status","==","open"))),list(query(col("quizzes"),where("year","==",Y),where("status","==","closed"))),list(query(col("quiz_results"),where("student_id","==",code),where("year","==",Y)))]);
  const qs=[...o,...c].sort((a,b)=>b.at-a.at),ls=seen("quiz");
  sShell(qs.map(q=>{
    const r=rs.find(x=>x.quiz_id==q.id);
    return `<div class="card"><div class="row"><b>${esc(q.title)}</b>${q.at>ls&&!r?'<span class="new">جديد</span>':""}</div><div class="m">${esc(q.subject_name)} • الأسبوع ${q.week_no} • ${q.questions.length} سؤال</div>
    <div class="row" style="margin-top:6px">${r?`<b class="ok">درجتك ${r.score}/${r.total}</b>`:q.status=="open"?'<span class="m">لم تحل بعد</span>':'<span class="m w">انتهى وقت الكويز</span>'}<button class="${!r&&q.status=="open"?"g":"s"}" style="width:auto" data-q="${esc(q.id)}">${r?"التفاصيل":q.status=="open"?"ابدأ الكويز":"عرض"}</button></div></div>`;
  }).join("")||'<div class="card m">مفيش كويزات متاحة دلوقتي</div>');
  seen("quiz",Date.now());
  document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>takeQuiz(qs.find(x=>x.id==b.dataset.q),rs.find(x=>x.quiz_id==b.dataset.q)));
}
function takeQuiz(q,res){
  const back=`<button class="s" id="bk">رجوع</button>`;
  const answers=()=>q.questions.map((qq,i)=>`<div class="card"><b>${i+1}. ${esc(qq.q)}</b><div class="ok">✔ ${esc(qq.options[qq.answer])}</div></div>`).join("");
  if(res||q.status!="open"){
    sShell(`<div class="card"><b>${esc(q.title)}</b>${res?`<div class="ok" style="margin-top:6px">درجتك ${res.score} من ${res.total} (${fmt(res.score/res.total*100)}%)</div>`:'<div class="m">انتهى وقت الكويز ولم يتم تسجيل محاولة</div>'}${q.status=="open"?'<div class="m">الإجابات الصحيحة هتظهر بعد قفل الكويز.</div>':""}</div>${q.status=="closed"?answers():""}${back}`);
    $("#bk").onclick=stuQuizzes;return;
  }
  const order=q.questions.map(qq=>shuffle(qq.options.map((_,i)=>i)));
  sShell(`<div class="card"><b>${esc(q.title)}</b><div class="m">${esc(q.subject_name)} • الأسبوع ${q.week_no} • محاولة واحدة فقط</div></div>
  ${q.questions.map((qq,i)=>`<div class="card"><b>${i+1}. ${esc(qq.q)}</b>${order[i].map(oi=>`<label class="opt"><input type="radio" name="q${i}" value="${oi}"><span>${esc(qq.options[oi])}</span></label>`).join("")}</div>`).join("")}
  <button class="g" id="sub">إرسال الإجابات</button>${back}<div class="m" id="qm"></div>`);
  $("#bk").onclick=stuQuizzes;
  $("#sub").onclick=async()=>{
    const picked=q.questions.map((_,i)=>{const c=document.querySelector(`input[name=q${i}]:checked`);return c?+c.value:-1});
    const un=picked.filter(x=>x<0).length;
    if(un&&!confirm(`فيه ${un} سؤال من غير إجابة. تبعتي كده؟`))return;
    const score=picked.filter((x,i)=>x===q.questions[i].answer).length;
    $("#sub").disabled=true;
    try{
      await setDoc(doc(db,"quiz_results",`${q.id}_${me.studentId}`),{quiz_id:q.id,student_id:me.studentId,student_name:me.name||"",subject_id:q.subject_id,year:Y,week_no:q.week_no,score,total:q.questions.length,ts:serverTimestamp()});
      sShell(`<div class="card"><b>تم تسجيل إجاباتك ✔</b><div class="ok" style="margin-top:6px">درجتك ${score} من ${q.questions.length} (${fmt(score/q.questions.length*100)}%)</div></div><button class="s" id="bk">رجوع</button>`);
      $("#bk").onclick=stuQuizzes;
    }catch(e){
      $("#qm").textContent=e.code==="permission-denied"?"محاولتك اتسجلت قبل كده أو الكويز اتقفل":(e.message||String(e));
      $("#sub").disabled=false;
    }
  };
}
</script>
